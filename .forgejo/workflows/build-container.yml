name: Build container image

on:
  push:
    tags:
      - v*

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Pull code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTIONS_TOKEN }}

      - name: Login to the Harbor registry
        uses: actions/login-action@v4
        with:
          registry: harbor.7strawby.net
          username: ${{ vars.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      
      - name: Build image
        run: docker build -t app .
      
      - name: Push image
        run: |
          IMAGE_ID="${{ vars.HARBOR_HOSTNAME }}/${{ vars.HARBOR_PROJECT }}/${{ forgejo.repository }}"
          VERSION="${{ forgejo.ref_name }}"
          docker tag app "$IMAGE_ID:$VERSION"
          docker push "$IMAGE_ID:$VERSION"
          docker tag app "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:latest"
